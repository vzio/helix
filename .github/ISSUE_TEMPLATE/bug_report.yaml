name: Bug Report
description: Create a report to help us improve
labels: C-bug
body:
  - type: markdown
    attributes:
      value: Thank you for filing a bug report! 🐛
  - type: textarea
    id: problem
    attributes:
      label: Summary
      description: >
        Please provide a short summary of the bug, along with any information
        you feel relevant to replicate the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      value: |
        <!-- Ideally provide a key sequence and/or asciinema.org recording. --> 

        I tried this:

        1. `vx`

        I expected this to happen:

        Instead, this happened:
  - type: textarea
    id: vortex-log
    attributes:
      label: Vortex log
      description: See `vx -h` for log file path. If you can reproduce the issue run `RUST_BACKTRACE=1 vx -vv` to generate a more detailed log file.
      value: |
        <details><summary>~/.cache/vortex/vortex.log</summary>

        ```
        please provide a copy of `~/.cache/vortex/vortex.log` here if possible, you may need to redact some of the lines
        ```

        </details>
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux / macOS / Windows
    validations:
      required: true
  - type: input
    id: terminal-emulator
    attributes:
      label: Terminal Emulator
      placeholder: wezterm 20220101-133340-7edc5b5a
    validations:
      required: true
  - type: input
    id: installation-method
    attributes:
      label: Installation Method
      description: >
        How you installed Vortex. Vortex is only built from source (for
        example `cargo install --path vortex-term --locked`); say if you did
        something different.
      placeholder: "source / cargo install"
    validations:
      required: true
  - type: input
    id: vortex-version
    attributes:
      label: Vortex Version
      description: >
        Vortex version (`vx -V`), and the commit you built (`git describe`).
        **Make sure that you are using the latest `main` of
        [vzio/vortex](https://github.com/vzio/vortex).**
      placeholder: "vortex 0.1.0 (5eaa6d97) (based on Helix 25.07.1 ba40e547)"
    validations:
      required: true
