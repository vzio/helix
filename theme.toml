"ui.hex.changed" = { fg = "red_light", modifiers = ["bold", "underlined"] }
"ui.hex.unreadable" = "n_5"
"ui.hex.unrecorded" = "n_3"

# Dashboard
"ui.dashboard.logo" = { fg = "purple", modifiers = ["bold"] }
"ui.dashboard.logo.shadow" = "purple_dark"
"ui.dashboard.credit" = "n_6"
"ui.dashboard.heading" = { fg = "n_11", modifiers = ["bold"] }
"ui.dashboard.label" = "n_6"
"ui.dashboard.value" = "n_9"
"ui.dashboard.key" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
