[palette]
background = "#0f0f0f"

# Reds, vivid to faded;
# contrast on the background in comments
red = "#d32836"           # 3.9  keywords, errors, deletions
red_light = "#e2595c"     # 5.5  constants, macros, escapes
red_faded = "#b9625e"     # 4.7  strings, warnings, changes
red_dusty = "#9c6a66"     # 4.4  operators, lifetimes
crimson = "#871c3e"       # 2.1  select mode (fills)
crimson_dark = "#4f1e37"  #      select-mode secondary cursors

# Purples, deep to soft
purple = "#7a46d3"        # 3.4  main color: title, normal mode, menus
purple_mid = "#9160e3"    # 4.7  types
purple_light = "#a585e8"  # 6.7  numbers, builtins, additions, main color as small text
purple_soft = "#9a86c4"   # 6.2  namespaces, attributes
purple_dark = "#3b1d6e"   #      logo shadow
cursor = "#5c32ad"        #      primary cursor (normal mode)
cursor_dim = "#3f2178"    #      secondary cursors
plum = "#3a1d4c"          #      insert mode
selection = "#211234"     #      secondary selections
selection_primary = "#2c1745" # primary selection
deep = "#131313"

# Neutral greys, no tint (n_1 darkest)
text = "#b1b1b3"
n_1 = "#151515"
n_2 = "#1d1d1e"
n_3 = "#29292a"
n_4 = "#383839"
n_5 = "#4c4c4c"
n_6 = "#636364"  # 3.3
n_7 = "#7d7d7f"  # 4.8
n_8 = "#979799"  # 6.8
n_9 = "#b1b1b3"  # 9.2
n_10 = "#c6c6c9" # 11.5
n_11 = "#d7d7da" # 13.7
