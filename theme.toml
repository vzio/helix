# Syntax highlighting
# -------------------
"attribute" = "purple_soft"

"type" = "purple_mid"
"type.builtin" = "purple_mid"
"type.parameter" = { fg = "purple_mid", modifiers = ["italic"] }
"type.enum.variant" = "red_light"

"constructor" = "n_10"

"constant" = "red_light"
"constant.builtin" = "purple_light"
"constant.character" = { fg = "red_faded", modifiers = ["bold"] }
"constant.character.escape" = { fg = "red_light", modifiers = ["bold"] }
"constant.numeric" = "purple_light"

"string" = "red_faded"
"string.regexp" = "red_light"
"string.special" = "red_light"
"string.special.url" = { fg = "red_faded", modifiers = ["underlined"] }
"string.special.path" = { fg = "red_faded", modifiers = ["bold"] }
"string.special.symbol" = "red_dusty"

"comment" = { fg = "n_6", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "n_7", modifiers = ["italic"] }
"comment.line.documentation" = { fg = "n_7", modifiers = ["italic"] }

"variable" = "n_9"
"variable.parameter" = { fg = "n_10", modifiers = ["italic"] }
"variable.builtin" = "purple_light"
"variable.other.member" = "n_10"

"label" = "red_dusty"

"punctuation" = "n_8"
"punctuation.special" = "purple_light"
"punctuation.bracket" = "n_6"
"punctuation.delimiter" = "n_7"

"keyword" = "red"
"keyword.operator" = "red_dusty"
"keyword.directive" = { fg = "red", modifiers = ["italic"] }
"keyword.storage.modifier" = { fg = "red", modifiers = ["italic"] }

"operator" = "red_dusty"

"function" = { fg = "n_11", modifiers = ["bold"] }
"function.builtin" = { fg = "n_11", modifiers = ["bold", "italic"] }
"function.macro" = "red_light"

"tag" = { fg = "red_light", modifiers = ["italic"] }

"namespace" = { fg = "purple_soft", modifiers = ["bold"] }

"special" = "purple_light" # fuzzy highlight

"markup.heading" = { fg = "purple_light", modifiers = ["bold"] }
"markup.list" = "red_dusty"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.link" = "red_faded"
"markup.link.url" = { fg = "red_faded", modifiers = ["italic", "underlined"] }
"markup.link.text" = "red_light"
"markup.raw" = { fg = "n_10", bg = "n_2" }
"markup.quote" = { fg = "n_8", modifiers = ["italic"] }

"diff.plus" = "purple_light"
"diff.minus" = "red"
"diff.delta" = "red_faded"
"diff.delta.moved" = "purple_soft"
"diff.delta.conflict" = { fg = "red_light", modifiers = ["bold"] }

# User interface
"ui.background" = { fg = "text", bg = "background" }
"ui.background.separator" = "n_4"

"ui.gutter" = { bg = "background" }
"ui.gutter.selected" = { bg = "n_1" }

"ui.linenr" = "n_4"
"ui.linenr.selected" = "n_7"
# bookmarks in the gutter: their number, then a marker past the ninth
"ui.gutter.bookmark" = { fg = "purple_light", modifiers = ["bold"] }

"ui.statusline" = { fg = "n_9", bg = "n_2" }
"ui.statusline.inactive" = { fg = "n_6", bg = "n_1" }
"ui.statusline.normal" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "n_11", bg = "plum", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "n_11", bg = "crimson", modifiers = ["bold"] }

"ui.popup" = { fg = "text", bg = "n_1" }
"ui.popup.info" = { fg = "text", bg = "n_1" }
"ui.info" = { fg = "purple_light", bg = "n_1" }
"ui.window" = "n_4"
"ui.help" = { fg = "text", bg = "n_1", modifiers = ["bold"] }

"ui.bufferline" = { fg = "n_7", bg = "background" }
"ui.bufferline.active" = { fg = "n_10", bg = "n_2", underline = { color = "purple", style = "line" } }
"ui.bufferline.background" = { bg = "background" }

"ui.text" = "text"
"ui.text.focus" = { fg = "n_11", bg = "n_2", underline = { color = "purple", style = "line" }, modifiers = ["bold"] }
"ui.text.inactive" = "n_5"
"ui.text.info" = "n_8"
"ui.text.directory" = "purple_light"

"ui.virtual" = "n_6"
"ui.virtual.ruler" = { bg = "n_1" }
"ui.virtual.whitespace" = "n_4"
"ui.virtual.indent-guide" = "n_3"
"ui.virtual.wrap" = "n_4"
"ui.virtual.inlay-hint" = { fg = "n_6", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }

"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection_primary" }

"ui.cursor" = { fg = "n_11", bg = "cursor_dim" }
"ui.cursor.primary" = { fg = "n_11", bg = "cursor", modifiers = ["bold"] }
"ui.cursor.normal" = { fg = "n_11", bg = "cursor_dim" }
"ui.cursor.insert" = { fg = "background", bg = "n_6" }
"ui.cursor.select" = { fg = "n_11", bg = "crimson_dark" }
"ui.cursor.primary.normal" = { fg = "n_11", bg = "cursor", modifiers = ["bold"] }
"ui.cursor.primary.insert" = { fg = "background", bg = "n_10", modifiers = ["bold"] }
"ui.cursor.primary.select" = { fg = "n_11", bg = "crimson", modifiers = ["bold"] }
"ui.cursor.match" = { fg = "red_light", modifiers = ["underlined"] }

"ui.cursorline.primary" = { bg = "n_1" }
"ui.cursorline" = { bg = "deep" }

"ui.highlight" = { fg = "purple_light", bg = "n_1", underline = { color = "purple", style = "line" }, modifiers = ["bold"] }

"ui.menu" = { fg = "n_10", bg = "n_1" }
"ui.menu.selected" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }

"ui.picker.header" = { fg = "n_9", modifiers = ["bold"] }
"ui.picker.header.column" = "n_7"
"ui.picker.header.column.active" = { fg = "purple_light", modifiers = ["bold", "underlined"] }

"ui.debug.breakpoint" = "red"
"ui.debug.active" = "purple_light"

"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "red_faded", style = "curl" } }
"diagnostic.info" = { underline = { color = "purple_light", style = "dotted" } }
"diagnostic.hint" = { underline = { color = "n_6", style = "dotted" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

error = { fg = "red", bg = "n_1" }
warning = { fg = "red_faded", bg = "n_1" }
info = { fg = "purple_light", bg = "n_1" }
hint = { fg = "n_8", bg = "n_1" }

# File tree and pickers
"ui.picker.divider" = { fg = "n_6", modifiers = ["bold"] }
"ui.explorer.ignored" = "n_5"

# Merge conflicts
"diagnostic.conflict" = { underline = { color = "red_light", style = "double_line" } }

# Inline blame
"ui.virtual.inline-blame" = { fg = "n_5", modifiers = ["italic"] }
"ui.virtual.inline-blame.hash" = "n_6"

# Watch mode: the session's changes in the gutter, the hunk followed to, the WATCH indicator
"diff.watch.plus" = "n_10"
"diff.watch.delta" = "red_light"
"diff.watch.minus" = "red_light"
"ui.highlight.watch" = { bg = "purple_dark" }
"ui.statusline.watch.following" = { fg = "n_11", bg = "purple_mid", modifiers = ["bold"] }
"ui.statusline.watch.paused" = { fg = "background", bg = "red_faded", modifiers = ["bold"] }
"ui.modebar" = { fg = "n_9", bg = "n_2" }
"ui.modebar.state" = { fg = "n_11", bg = "purple_mid", modifiers = ["bold"] }
"ui.modebar.state.following" = { fg = "n_11", bg = "purple_mid", modifiers = ["bold"] }
"ui.modebar.state.looking" = { fg = "background", bg = "red_faded", modifiers = ["bold"] }
"ui.modebar.info" = { fg = "n_9", bg = "n_2" }
"ui.modebar.key" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
"ui.modebar.label" = { fg = "n_10", bg = "n_2" }
# debug mode's bar: its states, and the lineline
"ui.modebar.state.idle" = { fg = "n_9", bg = "n_3", modifiers = ["bold"] }
"ui.modebar.state.playing" = { fg = "n_11", bg = "purple_mid", modifiers = ["bold"] }
"ui.modebar.state.paused" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
"ui.modebar.state.rewind" = { fg = "background", bg = "red_faded", modifiers = ["bold"] }
"ui.modebar.state.loading" = { fg = "purple_light", bg = "n_2", modifiers = ["bold"] }
"ui.modebar.lineline" = { fg = "purple_soft", bg = "n_2" }
"ui.modebar.lineline.playhead" = { fg = "n_11", modifiers = ["bold"] }
"ui.modebar.lineline.dead" = "red"
"ui.modebar.lineline.gap" = "n_6"
"ui.modebar.lineline.now" = "n_5"
"ui.modebar.lineline.breakpoint" = "red"
"ui.modebar.lineline.exception" = { fg = "red_light", modifiers = ["bold"] }
"ui.modebar.lineline.pause" = "purple_light"
"ui.modebar.lineline.switch" = "n_10"
"ui.modebar.lineline.end" = "n_9"
"ui.modebar.lineline.covered" = "n_7"
"ui.modebar.lineline.read" = "purple_light"
"ui.modebar.lineline.write" = "red_faded"

# Terminal panel and its SH indicator
"ui.terminal" = { fg = "text", bg = "background" }
"ui.statusline.shell" = { fg = "n_8", bg = "n_2" }
"ui.statusline.shell.running" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
"ui.statusline.shell.success" = { fg = "background", bg = "purple_light", modifiers = ["bold"] }
"ui.statusline.shell.failure" = { fg = "n_11", bg = "red", modifiers = ["bold"] }

# Debugger: the line the program stopped at, breakpoints, the panel, and its statusline item
"ui.highlight.frameline" = { bg = "plum" }
"ui.debug.breakpoint.unverified" = "red_dusty"
"ui.debug.breakpoint.disabled" = "n_5"
"ui.debug.panel" = { fg = "text", bg = "background" }
"ui.debug.tab" = { fg = "n_7", bg = "n_1" }
"ui.debug.tab.active" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
"ui.debug.name" = "n_10"
"ui.debug.value" = "n_9"
"ui.debug.value.changed" = { fg = "red_light", modifiers = ["bold"] }
"ui.debug.heading" = { fg = "n_11", modifiers = ["bold"] }
"ui.debug.console.error" = "red"
"ui.debug.console.info" = "n_7"
"ui.debug.console.input" = "purple_light"
"ui.statusline.debug.running" = { fg = "n_11", bg = "purple", modifiers = ["bold"] }
"ui.statusline.debug.stopped" = { fg = "n_11", bg = "red", modifiers = ["bold"] }
"ui.statusline.debug.exited" = { fg = "background", bg = "purple_light", modifiers = ["bold"] }
"ui.statusline.debug.failed" = { fg = "n_11", bg = "crimson", modifiers = ["bold"] }
"ui.statusline.debug.playing" = { fg = "n_11", bg = "purple_mid", modifiers = ["bold"] }
"ui.debug.rewind" = { fg = "background", bg = "red_faded", modifiers = ["bold"] }
"ui.debug.frozen" = "purple_soft"
"ui.debug.memory" = "purple_soft"
"ui.debug.carried" = { fg = "n_6", modifiers = ["italic"] }
"ui.debug.loading" = "purple_light"
"ui.debug.loading.bar" = "purple"
"ui.debug.loading.glow" = { fg = "purple_light", modifiers = ["bold"] }
"ui.debug.loading.track" = "n_3"
"ui.virtual.step-time" = { fg = "n_6", modifiers = ["italic"] }

# Hex view
"ui.hex.null" = "n_4"
"ui.hex.printable" = "n_10"
"ui.hex.whitespace" = "purple_soft"
"ui.hex.control" = "red_dusty"
"ui.hex.other" = "purple_mid"
"ui.hex.prefix" = "n_4"
"ui.hex.offset" = "n_6"
