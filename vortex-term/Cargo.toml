[package]
name = "vortex-term"
description = "A post-modern text editor."
include = ["src/**/*", "README.md"]
default-run = "vx"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.deb]
# generate a .deb in target/debian/ with the command: cargo deb --no-build
name = "vortex"
assets = [
  { source = "target/release/vx", dest = "/usr/lib/vortex/", mode = "755" },
  { source = "../contrib/vx_launcher.sh", dest = "/usr/bin/vx", mode = "755" },
  { source = "../runtime/*", dest = "/usr/lib/vortex/runtime/", mode = "644" },
  { source = "../runtime/grammars/*", dest = "/usr/lib/vortex/runtime/grammars/", mode = "644" }, # to avoid sources/
  { source = "../runtime/queries/**/*", dest = "/usr/lib/vortex/runtime/queries/", mode = "644" },
  { source = "../runtime/themes/**/*", dest = "/usr/lib/vortex/runtime/themes/", mode = "644" },
  { source = "../README.md", dest = "/usr/share/doc/vortex/", mode = "644" },
  { source = "../contrib/completion/vx.bash", dest = "/usr/share/bash-completion/completions/vx", mode = "644" },
  { source = "../contrib/completion/vx.fish", dest = "/usr/share/fish/vendor_completions.d/vx.fish", mode = "644" },
  { source = "../contrib/completion/vx.zsh", dest = "/usr/share/zsh/vendor-completions/_vx", mode = "644" },
  { source = "../contrib/Vortex.desktop", dest = "/usr/share/applications/Vortex.desktop", mode = "644" },
]

[features]
default = ["git"]
unicode-lines = ["vortex-core/unicode-lines", "vortex-view/unicode-lines"]
integration = ["vortex-event/integration_test"]
git = ["vortex-vcs/git"]
# Exposes internals. Should not be enabled except for benchmarking.
bench = []

[[bin]]
name = "vx"
path = "src/main.rs"

[dependencies]
vortex-stdx = { path = "../vortex-stdx" }
vortex-core = { path = "../vortex-core" }
vortex-event = { path = "../vortex-event" }
vortex-view = { path = "../vortex-view" }
vortex-lsp = { path = "../vortex-lsp" }
vortex-dap = { path = "../vortex-dap" }
vortex-vcs = { path = "../vortex-vcs" }
vortex-loader = { path = "../vortex-loader" }

anyhow = "1"
tempfile.workspace = true

tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot", "sync", "net"] }
tui = { path = "../vortex-tui", package = "vortex-tui", default-features = false, features = ["termina"] }
termina = { workspace = true, features = ["event-stream"] }
signal-hook = "0.4"
tokio-stream = "0.1"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
arc-swap.workspace = true
termini = "1"
indexmap = { version = "2.14", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# File picker
nucleo.workspace = true
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
# markdown doc rendering
pulldown-cmark = { version = "0.13", default-features = false }
thiserror.workspace = true

# opening URLs
open = "5.3.5"

# config
toml.workspace = true

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

dashmap = "6.2"

parking_lot.workspace = true
imara-diff = "0.2.0"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
libc = "0.2.186"

[build-dependencies]
vortex-loader = { path = "../vortex-loader" }

[dev-dependencies]
smallvec = "1.15"
indoc = "2.0.6"
regex = "1"
tempfile.workspace = true
same-file = "1.0.1"
criterion.workspace = true

# cargo bench -p vortex-term --features bench --bench explorer
[[bench]]
name = "explorer"
harness = false
required-features = ["bench"]
