title = "Straight to line 4"
topic = "goto"
feature = "Go to a line: <n>G"
lesson = """
A count before `G` jumps to that line: `4G` is line 4. Handy when an error
message gives you a line number. Then `x` selects that line and `d` deletes
it.
"""
