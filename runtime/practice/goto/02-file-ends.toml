title = "Top and bottom"
topic = "goto"
feature = "File ends: gg and ge"
lesson = """
`gg` goes to the first line, `ge` to the last one. Handy before `O` (open a
line above) and `o` (open a line below).
"""
start = """
b
#[c|]#
d
"""
goal = """
a
b
c
d
e
"""
hints = [
