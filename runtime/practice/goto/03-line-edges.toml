title = "Line edges"
topic = "goto"
feature = "gh, gl and gs: line start, end, first non-blank"
lesson = """
`gh` goes to the line start, `gl` to the last character, `gs` to the first
non-blank one. After `gl`, `a` appends after the cursor. (`A` does both in one
key.)
"""
start = """
    let x = 5
"""
goal = """
    let x = 5;
"""
hints = [
  "A semicolon is missing at the end.",
  "Go to the end of the line, then append.",
  "`gl` to the last character, `a`, type `;`, `Esc`.",
]
teach = "gla;<esc>"
gold = "A;<esc>"
