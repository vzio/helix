title = "There and back"
chapter = "search"
kind = "learn"
feature = "ga jumps back to where you were before a search"
lesson = """
A search is a jump, and Vortex keeps a history of jumps: `ga` (this fork's)
goes back to where you were before it, selection and all. Go and fetch
something far away, then `ga` and use it right where you left off.
"""
language = "markdown"
start = '''
## Install

Get the binary for your platform from the
[release page]#[|(]#)
and put it on your `PATH`.

## Configure

Copy `fetchd.example.toml` to
`~/.config/fetchd/config.toml`.

## Links

- Releases: https://fetchd.dev/releases/latest
- Issues: https://fetchd.dev/issues
'''
