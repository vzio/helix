title = "There and back"
chapter = "search"
kind = "learn"
feature = "Ctrl-o jumps back to where you were before a search"
lesson = """
A search is a jump, and Helix keeps a list of jumps: `<C-o>` goes back to
where you were before it, selection and all. Go and fetch something far
away, then `<C-o>` and use it right where you left off.
"""
language = "markdown"
start = '''
## Install

Get the binary for your platform from the
[release page]#[|(]#)
and put it on your `PATH`.

## Configure

Copy `fetchd.example.toml` to
`~/.config/fetchd/config.toml`.

## Links

- Releases: https://fetchd.dev/releases/latest
- Issues: https://fetchd.dev/issues
'''
