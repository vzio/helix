hints = [
  "The link goes inside the parentheses where the cursor is; the address is in the Links list at the bottom.",
  "A regex like `https\\S+` selects a whole address; `y` yanks it; `<C-o>` jumps back to where the search started; `p` pastes after the cursor.",
  "`/https\\S+<ret>`, `y`, `<C-o>`, `p`.",
]
