title = "Only this function"
chapter = "search"
kind = "apply"
feature = "In select mode, n adds the next match as a selection"
lesson = """
In select mode (`v`), `n` doesn't jump to the next match, it adds it as one
more selection. Search for a word with `*`, add matches with `n` as far as
you need, and change them all at once. `.` would take two keys per match.
"""
language = "javascript"
start = '''
async function loadFeeds(url) {
  const #[|d]#ata = await (await fetch(url)).json();
  if (!data.ok) throw new Error(data.error);
  cache.set(url, data.items);
  return data.items;
}

function render(data) {
  return data.items.map(view).join("");
}
'''
goal = '''
async function loadFeeds(url) {
  const body = await (await fetch(url)).json();
  if (!body.ok) throw new Error(body.error);
  cache.set(url, body.items);
  return body.items;
}

function render(data) {
  return data.items.map(view).join("");
}
'''
