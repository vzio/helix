title = "Take it back"
chapter = "undo-repeat"
kind = "learn"
feature = "u undoes the last change"
lesson = """
`u` undoes the last change, and pressing it again goes further back. This
buffer comes with a history: two edits were made before you arrived, and both
were mistakes.
"""
language = "python"
before = [
'''
def retry(fn, attempts=3, delay=0.5):
    for attempt in range(attempts):
        try:
            return fn()
        except TimeoutError:
            if attempt == attempts - 1:
                raise
            time.sleep(delay * 2 ** attempt)
''',
'''
