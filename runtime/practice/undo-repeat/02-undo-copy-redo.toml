title = "Back in time for one line"
chapter = "undo-repeat"
kind = "learn"
feature = "u to go back, U to come forward again"
lesson = """
`U` redoes what `u` undid. Together they let you visit an older version: undo
until the text you lost is back, yank it, redo to where you were, and paste.
Your later edits are not lost on the way.
"""
language = "python"
