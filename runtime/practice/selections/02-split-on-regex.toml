title = "Split, then collapse"
topic = "selections"
feature = "Split on a regex: S, with ; and A-;"
lesson = """
`S` splits the selection at every regex match: here, at every space. `A-;`
flips each selection (cursor to its start) and `;` collapses it to that
cursor.
"""
start = """
the quick brown fox
"""
goal = """
The Quick Brown Fox
"""
hints = [
  "Every word needs a capital letter.",
  "Split the line into words, put a cursor on each first letter, and switch case.",
  "`x`, `S` then a space and Enter, `A-;` and `;` for the first letters, then `~`.",
]
teach = "xS <ret><A-;>;~"
