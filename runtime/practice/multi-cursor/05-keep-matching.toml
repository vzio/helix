title = "Keep what matches"
chapter = "multi-cursor"
kind = "learn"
feature = "K keeps only the selections that match a regex"
lesson = """
Selecting everything and then narrowing down is often easier than selecting
the right places directly. Split the buffer into lines (`%` then `<A-s>`),
and `K` keeps only the selections that match a regex. Then act on all of
them at once: `x` grows each into a whole line.
"""
language = "javascript"
start = '''
export async function sync(feed) {
  console.log("sync", feed.id);
  const res = await fetch(feed.url);
  console.log("status", res.status);
  if (!res.ok) {
    console.error("fetch failed", res.status);
    throw new Error(res.statusText);
  }
  const items = await res.json();
  console.log("items", items.length);
  await db.save(feed.id, items);
  console.log("saved");
  return items.length;
}
'''
