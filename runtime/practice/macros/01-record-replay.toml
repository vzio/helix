title = "Record it once"
topic = "macros"
feature = "Macros: Q to record, q to replay (with a count)"
lesson = """
`Q` starts recording keys, `Q` again stops. `q` replays them; `2q` replays
twice. End the recording with a motion to the next line, and the replays walk
down the lines.
"""
start = """
apple
banana
cherry
"""
goal = """
- apple
- banana
- cherry
"""
hints = [
  "Every line gets a dash and a space in front.",
  "Do the edit on the first line while recording, ending on the next line, then replay.",
  "`Q` `I` `- ` `Esc` `j` `Q` records it, `2q` does the other two lines.",
]
teach = "QI- <esc>jQ2q"
