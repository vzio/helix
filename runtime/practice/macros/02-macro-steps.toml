title = "A macro with several steps"
topic = "macros"
feature = "Macros: many keys, one replay"
lesson = """
A macro can hold any keys. End it where the next run has to start (`gh`
returns to column one after `j`) and then `2q` replays it for the next two
lines.
"""
start = """
get the milk
call mom
fix the bike
"""
goal = """
Get the milk.
Call mom.
Fix the bike.
"""
hints = [
  "Every line: capital first letter, a period at the end.",
  "Record the edits for one line, ending at the start of the next line, then replay.",
  "`Q` `~` `A.` `Esc` `j` `gh` `Q` records line one; `2q` does the rest.",
]
teach = "Q~A.<esc>jghQ2q"
gold = "2C~A.<esc>"
