title = "Record once, replay"
chapter = "macros"
kind = "learn"
feature = "Q records a macro, q replays it"
lesson = """
`Q` starts recording your keys and `Q` again stops; `q` replays them, and
`4q` replays them four times. Macros shine where every record needs the same
keys but multiple selections can't reach the places, like joining lines.
"""
