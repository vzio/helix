Grace Hopper <grace@example.com>, Arlington
Margaret Hamilton <margaret@example.com>, Boston
Linus Torvalds <linus@example.com>, Portland
'''
hints = [
  "Each contact is three lines that become one, with the same punctuation added every time.",
  "Record one contact with `Q` (and `Q` to stop), then replay with a count. Add the brackets on the email line first; `J` then joins lines with a space between them.",
  "`Q` to start recording. `j`, `I<<esc>` and `A>,<esc>` on the email, `k` back up, `JJ` joins the three lines, `j` to the next contact, `Q` to stop. `4q` does the other four.",
]
