title = "Next argument, please"
chapter = "syntax"
kind = "learn"
feature = "Alt-n and Alt-p select the next and previous sibling node"
lesson = """
`<A-n>` selects the next node at the same level, `<A-p>` the previous one.
Between two arguments sits a comma, which is a node too: two presses go from
one argument to the next, however long each is.
"""
language = "python"
start = '''
db = connect(host, tls(cert, verify=False), 30)
mq = subscribe(topic, Retry(max=5, backoff=2), 10)
kv = open_store(path, LRUCache(size=1024), 60)
'''
goal = '''
db = connect(host, None, 30)
mq = subscribe(topic, None, 10)
kv = open_store(path, None, 60)
'''
hints = [
  "The middle argument of each call goes; each is a different call with arguments of its own, so no regex fits them all, but they all come right after the first argument.",
  "`<A-o>` selects the argument under the cursor as a node; `<A-n>` moves to the next node; the comma in between is a node as well. With a cursor on every line, it happens on all three.",
  "`%<A-s>` for a cursor per line, `gh` to their starts, `f(l` onto the first arguments, `<A-o>` selects them, `<A-n><A-n>` steps over the commas to the middle ones, `cNone<esc>`.",
]
teach = "%<A-s>ghf(l<A-o><A-n><A-n>cNone<esc>"
