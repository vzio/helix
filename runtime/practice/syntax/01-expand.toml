title = "Grow the selection"
topic = "syntax"
feature = "Expand to syntax nodes: A-o"
language = "rust"
lesson = """
With a syntax tree, `A-o` expands the selection to the next bigger syntax
node: a name, then the expression it is part of, then the call, the
statement... `A-i` shrinks it back.
"""
start = """
fn main() {
    let n = add(#[w|]#idth * 2, 3);
}
"""
goal = """
fn main() {
    let n = add(7, 3);
}
"""
hints = [
  "The first argument is an expression, not one word.",
  "Grow the selection by syntax nodes until it covers the argument.",
  "`A-o` selects `width`, `A-o` again selects `width * 2`; then `c`, `7`, `Esc`.",
]
teach = "<A-o><A-o>c7<esc>"
