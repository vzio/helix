title = "Whole functions"
chapter = "syntax"
kind = "learn"
feature = "]f goes to the next function; maf selects the function around the cursor"
lesson = """
`]f` selects the next function, all of it, and `maf` the function the cursor
is in (`f` is the function text object). Add `x` to round the selection out
to whole lines; each further `x` takes a blank line after it too.
"""
language = "python"
