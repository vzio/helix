title = "Every parameter"
chapter = "syntax"
kind = "learn"
feature = "Alt-a selects all siblings of the node"
lesson = """
`<A-a>` selects the node under the cursor and all its siblings, one selection
each: every parameter of a function, every element of a list. Punctuation
like commas is left out, so `a` appends to each item cleanly.
"""
language = "python"
start = '''
def scale(width, height, factor):
    return width * factor, height * factor


def clamp(value, low, high):
    return max(low, min(value, high))
'''
goal = '''
def scale(width: int, height: int, factor: int):
    return width * factor, height * factor


def clamp(value: float, low: float, high: float):
    return max(low, min(value, high))
'''
hints = [
  "Every parameter gets a type: `int` in the first function, `float` in the second.",
