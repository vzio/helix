title = "Sort the imports"
chapter = "shell"
kind = "learn"
feature = "| pipes the selection through a shell command"
lesson = """
`|` runs a shell command with each selection as its input and replaces the
selection with the output. `sort`, `uniq`, `tr`, `cut`: every small Unix tool
becomes an editing command.
"""
