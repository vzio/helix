title = "Rewrap the paragraph"
chapter = "shell"
kind = "learn"
feature = ":reflow rewraps the selection to a width"
lesson = """
After editing a paragraph its lines are ragged. `:reflow` rewraps the
selected text to the text width, or to the width you give it: `:reflow 40`.
Select the paragraph with `mip` first.
"""
