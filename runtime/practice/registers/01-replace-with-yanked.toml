title = "Copy over"
topic = "registers"
feature = "Replace with yanked text: R"
lesson = """
`y` yanks the selection into the default register. `R` replaces each selection
with the yanked text and leaves the register alone, so you can replace again
and again.
"""
start = """
primary: #[t|]#eal
accent: coral
"""
goal = """
primary: teal
accent: teal
"""
hints = [
  "The second color becomes the first one.",
  "Yank a word, select the other one, replace it with the yanked text.",
  "`ey` yanks `teal`, `j` and `miw` select `coral`, `R` replaces it.",
]
teach = "eyjmiwR"
