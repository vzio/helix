feature = "x on an empty line selects only that line, so 3x is three lines"
lesson = """
In this fork `x` on an empty line selects just that line (upstream also takes
the next one), so counts work from a blank line too: `4x` selects exactly
four lines starting there, and `4xd` deletes them.
"""
