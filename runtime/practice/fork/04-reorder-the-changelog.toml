title = "Reorder the changelog"
chapter = "fork"
kind = "challenge"
feature = "Move mode with selections of several lines"
lesson = """
Move mode moves whatever lines the selection touches, so a multi-line entry
moves as one piece. Group the changelog: features first, then fixes, keeping
each entry's lines together.
"""
language = "markdown"
start = '''
## 0.4.0

- Fix: a feed with no items no longer
  crashes the scheduler.
- Feature: `--watch` refetches a feed
  when its config changes.
- Fix: timeouts are retried.
- Feature: OPML import.
- Fix: the cache directory is created
  when it is missing.
'''
