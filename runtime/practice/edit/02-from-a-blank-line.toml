title = "From a blank line"
chapter = "edit"
kind = "learn"
feature = "x on an empty line selects just that line"
lesson = """
Blank lines usually go with the block they separate. `x` on an empty line
selects just that line, and each further `x` adds the next one, so you can
start a selection on the blank line above a block. (Upstream Helix also takes
the next line there; this fork doesn't.)
"""
language = "python"
