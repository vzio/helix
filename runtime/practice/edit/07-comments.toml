title = "Comment it out"
chapter = "edit"
kind = "learn"
feature = "Ctrl-c comments the selected lines out, or back in"
lesson = """
`<C-c>` comments out the selected lines with the language's comment marker,
or uncomments them when they are all commented. With `x` it works on several
lines at once, keeping their indentation.
"""
language = "javascript"
start = '''
export function bootstrap(app) {
  // app.use(helmet());
  app.use(logger());
  app.use(cors({ origin: "*" }));
  app.use(rateLimit({ max: 100 }));
  app.use(compression());
  app.use(router);
}
'''
goal = '''
