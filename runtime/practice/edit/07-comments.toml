}
'''
hints = [
  "One middleware comes back, three in a row go away.",
  "`<C-c>` toggles the comment on the selected lines; with nothing selected but the cursor, on the cursor's line.",
  "`j<C-c>` brings `helmet` back. `jj` to `cors`, `xxx` for it and the next two lines, `<C-c>`.",
]
