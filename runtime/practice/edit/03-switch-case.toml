title = "Constants"
chapter = "edit"
kind = "learn"
feature = "~ switches the case of the selection"
lesson = """
`~` turns lower case into upper case and the other way round, for everything
selected. With `x` that is the whole line: digits, spaces and `=` stay as
they are.
"""
