title = "Two registers"
chapter = "yank-paste"
kind = "learn"
feature = "\"a picks register a for the next yank or paste"
lesson = """
`"` and a letter pick a register for the next command: `"ay` yanks into `a`,
`"ap` pastes from it. The plain `y` and `p` still use the default register,
so you can carry two texts at once and paste them in turns.
"""
language = "python"
start = '''
def iter_users():
    conn = pool.acquire(timeout=5)
    yield from conn.fetch("select * from users")
    pool.release(conn, reset=True)

def iter_orders():
    yield from conn.fetch("select * from orders")

def iter_plans():
    yield from conn.fetch("select * from plans")
'''
