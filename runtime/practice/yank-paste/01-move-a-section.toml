title = "Move a section"
chapter = "yank-paste"
kind = "learn"
feature = "d yanks what it deletes; p and P paste it"
lesson = """
Whatever `d` deletes is also yanked, so delete and paste is how text moves.
`p` pastes after the selection and `P` before it; whole lines (from `x`) are
pasted as whole lines, below or above the cursor's line.
"""
language = "markdown"
start = '''
# fetchd

## Usage

    fetchd --watch ./feeds.toml

## Installation

    cargo install fetchd

## License

MIT
'''
goal = '''
