title = "Paste while typing"
chapter = "yank-paste"
kind = "learn"
feature = "Ctrl-r in insert mode pastes a register"
lesson = """
In insert mode `<C-r>` followed by a register name pastes that register right
where you type, without leaving insert mode: `<C-r>"` is the last yank. Yank
the long part once, type the short parts around it.
"""
