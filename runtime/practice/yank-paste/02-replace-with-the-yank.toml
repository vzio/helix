title = "Replace with the yank"
chapter = "yank-paste"
kind = "learn"
feature = "y yanks the selection, R replaces a selection with it"
lesson = """
`y` yanks (copies) the selection. `R` replaces the selection with what was
yanked, and keeps it yanked, so you can do it again and again: one yank,
any number of replacements.
"""
start = '''
# api/.env
DATABASE_URL=postgres://shop@db:5432/shop
# worker/.env
DATABASE_URL=TODO
# migrate/.env
DATABASE_URL=TODO
# reports/.env
DATABASE_URL=TODO
'''
