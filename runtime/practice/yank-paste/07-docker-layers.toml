USER app
CMD ["app"]
'''
hints = [
  "The source is copied after the dependencies are fetched, so editing code doesn't fetch them again. And `USER app` comes after the user is created.",
  "`M` then `2j` moves the line under the cursor down two lines in one go. `<esc>` leaves move mode, and `j` moves the cursor again.",
  "`M2j` moves `COPY src` below `RUN cargo fetch`. `<esc>`, `4j` down to `USER app`, and `M2j` again.",
]
teach = "M2j<esc>4jM2j"
