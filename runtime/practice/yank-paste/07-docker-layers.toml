title = "Fix the Dockerfile"
chapter = "yank-paste"
kind = "apply"
feature = "Move mode with a count, twice in one file"
lesson = """
Order matters in a Dockerfile: every line is a cached layer, and a user must
exist before `USER` switches to it. `M` with a count moves a line straight to
its place, and `<esc>` leaves move mode to go to the next one.
"""
language = "dockerfile"
start = '''
FROM rust:1.82 AS build
WORKDIR /app
#[|C]#OPY src ./src
COPY Cargo.toml Cargo.lock ./
RUN cargo fetch
RUN cargo build --release

FROM debian:bookworm-slim
USER app
RUN useradd --system app
COPY --from=build /app/target/release/app /bin/
CMD ["app"]
'''
goal = '''
