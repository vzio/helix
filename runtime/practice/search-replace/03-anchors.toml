title = "Anchors"
topic = "search-replace"
feature = "Select all matches of a regex: %s with ^"
lesson = """
`%` selects the whole buffer, `s` then selects every match inside it. `^`
matches at the start of each line and `$` at the end: `%s^> ` Enter puts a
cursor on every `> `.
"""
start = """
> hello
> there
> bye
"""
goal = """
hello
there
bye
"""
hints = [
  "The quote markers at the start of each line must go.",
  "Select all of them with a regex anchored to the line start, then delete.",
  "`%` then `s`, type `^> ` (with the space), Enter, then `d`.",
]
teach = "%s^<gt> <ret>d"
