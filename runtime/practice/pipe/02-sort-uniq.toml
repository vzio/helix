title = "Unique lines"
topic = "pipe"
feature = "Chain commands in a pipe: sort | uniq"
lesson = """
The prompt takes a whole shell pipeline. `uniq` drops repeated neighbours, so
sort first: `%|sort|uniq` Enter leaves each line once, in order.
"""
start = """
rust
helix
rust
toml
helix
rust
"""
goal = """
helix
rust
toml
"""
hints = [
  "Each name should appear once, and sorted.",
  "Pipe everything through two commands, the second removes duplicates.",
  "`%|sort|uniq` and Enter.",
]
teach = "%|sort|uniq<ret>"
