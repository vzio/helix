title = "Let sort do it"
topic = "pipe"
feature = "Pipe the selection through a command: |"
lesson = """
`|` runs a shell command with the selection as input and replaces the
selection with the output. `%|sort` Enter sorts the whole buffer's lines.
"""
start = """
pear
apple
fig
banana
"""
goal = """
apple
banana
fig
pear
"""
hints = [
  "The lines have to be in alphabetical order.",
  "Select everything and filter it through an external command.",
  "`%` selects all, `|` then `sort` and Enter.",
]
teach = "%|sort<ret>"
