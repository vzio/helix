title = "Up to the semicolon"
topic = "motions"
feature = "Find and till: f, t (F, T backwards)"
lesson = """
`f<char>` selects up to and including the next `<char>` on the line, `t<char>`
stops just before it. `F` and `T` do the same backwards. Use `t;c` to change
everything before a `;`.
"""
start = """
status = #[n|]#ot ready yet;
"""
goal = """
status = ready;
"""
hints = [
  "The value is longer than one word.",
  "Select up to (not including) the semicolon, then change it.",
  "`t;` selects up to the `;`, then `c`, type `ready`, `Esc`.",
]
teach = "t;cready<esc>"
