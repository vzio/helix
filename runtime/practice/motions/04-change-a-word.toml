title = "A shorter name"
chapter = "motions"
kind = "learn"
feature = "c changes the selection; w, e and b select words"
lesson = """
`c` deletes the selection and starts insert mode in its place: select a word
with `e` (or `w`, `b`), press `c`, type the new word. However long the old
word was, deleting it was one key.
"""
language = "python"
start = '''
def notify_overdue(customers, today):
    for current_customer_record in customers:
        if current_customer_record.due < today:
            send_reminder(current_customer_record)
'''
goal = '''
def notify_overdue(customers, today):
    for customer in customers:
        if customer.due < today:
            send_reminder(customer)
'''
