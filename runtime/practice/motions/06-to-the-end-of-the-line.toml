title = "To the end of the line"
chapter = "motions"
kind = "learn"
feature = "gh, gl, gs; v extends the selection, ; collapses it"
lesson = """
`gh`, `gl` and `gs` go to the start of the line, its end, and its first
non-blank. `v` is select mode: motions extend the selection instead of
starting a new one. `;` shrinks the selection back to the cursor, so
`;vgld` deletes from the cursor to the end of the line.
"""
language = "javascript"
start = '''
function report(stats) {
  console.log(stats.total); // eslint-disable-line
  const avg = stats.sum / stats.count;
  console.log(avg); // eslint-disable-line
  console.log(stats.max); // eslint-disable-line
  return avg;
}
'''
