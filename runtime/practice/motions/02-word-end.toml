title = "Land on the last letter"
topic = "motions"
feature = "End of word: e, then append with a"
lesson = """
`e` selects up to the end of the word. `a` then appends right after the
selection, so `ea` puts you at the end of a word, wherever the cursor was
inside it.
"""
start = """
Buy three #[a|]#pple today
"""
goal = """
Buy three apples today
"""
hints = [
  "Only one letter is missing, at the end of a word.",
  "Select to the end of the word, then append after the selection.",
  "`e` selects `apple`, `a` starts typing after it: type `s`, then `Esc`.",
]
teach = "eas<esc>"
