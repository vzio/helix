title = "Redact the tokens"
chapter = "motions"
kind = "learn"
feature = "r replaces every selected character"
lesson = """
`r` followed by a character replaces each selected character with it, so the
selection keeps its length. Select a word and `r*` hides it, `r-` or `r=`
draws a line of the same width.
"""
