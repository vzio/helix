title = "Inside the quotes"
chapter = "text-objects"
kind = "learn"
feature = "mi\" selects inside quotes, ma\" around them"
lesson = """
`mi` selects inside a pair and `ma` around it: `mi\"` is the text between two
quotes, `ma\"` includes the quotes. The cursor only has to be in the string or
on one of its quotes, so `gl` (the closing quote at the end) is enough.
"""
