title = "Innermost brackets"
topic = "text-objects"
feature = "Brackets: mi( and ma("
lesson = """
`mi(` selects between the nearest pair of parentheses around the cursor, `ma(`
includes them. The same works with `[`, `{`, `<` and the aliases `b`, `B`.
"""
start = """
max(1, min(9#[4|]#), 2)
"""
goal = """
max(1, min(), 2)
"""
hints = [
  "Empty the inner call, nothing else.",
  "Select what is between the nearest parentheses and delete it.",
  "`mi(` selects `94`, then `d`.",
]
teach = "mi(d"
