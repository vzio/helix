title = "Inside the quotes"
topic = "text-objects"
feature = "Inner quotes: mi\""
lesson = """
`mi"` selects the text between a pair of quotes around the cursor, without the
quotes. Works for `'` and `` ` `` too; `ma"` takes the quotes along.
"""
start = """
greeting = "he#[l|]#lo world"
"""
goal = """
greeting = "hi"
"""
hints = [
  "Only the text between the quotes changes.",
  "Select what is inside the quotes with a text object.",
  "`mi\"` selects it, then `c`, type `hi`, `Esc`.",
]
teach = 'mi"chi<esc>'
