title = "Double quotes"
chapter = "surround"
kind = "learn"
feature = "mr replaces the pair around the cursor"
lesson = """
`mr` replaces the nearest pair around the cursor with another: `mr'\"` turns
single quotes into double quotes, `mr([` parentheses into brackets. Only the
two delimiters change, whatever is between them.
"""
