title = "Down, not across"
chapter = "basics"
kind = "learn"
feature = "j and k move between lines; i starts typing, Esc stops"
lesson = """
Helix is modal. In normal mode keys are commands; `i` switches to insert mode
to type before the cursor, and `<esc>` switches back. `h` `j` `k` `l` move
left, down, up and right: `j` keeps the column, so going down five lines is
five keys, however long the lines are.
"""
