title = "Four typos"
chapter = "basics"
kind = "apply"
feature = "h j k l to get close, i and a to type"
lesson = """
`i` types before the cursor and `a` after it: to add a letter after the
cursor's letter, `a` is one key where `l` then `i` would be two. Go between
lines with `j` and `k`, then fine-tune with `h` and `l`.
"""
